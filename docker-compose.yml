name: ghartak

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ghartak
      POSTGRES_PASSWORD: ghartak
      POSTGRES_DB: ghartak
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghartak -d ghartak"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - ghartak_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru

  redis-queue:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction

volumes:
  ghartak_pg:
