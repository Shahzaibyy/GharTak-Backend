openapi: "3.0.3"
info:
  title: GharTak API
  version: "0.1.0"
  description: |
    Local API for the GharTak backend. Success responses use `{"data":...}`.
    Errors use `{"error":{"code","message"}}`.

    In development, `POST /auth/otp/request` returns `dev_otp`. Send that code to
    `POST /auth/otp/verify`, then paste `access_token` into the Authorize button as a Bearer token.
    Customer Google sign-in is `POST /auth/google`. Profile is `GET /users/me`. Upload targets are `POST /uploads/presign`.

    Attock City zone id: `11111111-1111-4111-8111-111111111101`.
    Demo kitchen id: `22222222-2222-4222-8222-222222222201`.
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Zones
  - name: Auth
  - name: Merchants
  - name: Addresses
  - name: Orders
  - name: Riders
  - name: Admin
  - name: Payments
  - name: Dispatch
  - name: Chat
  - name: Support
  - name: Notifications
  - name: Geo
paths:
  /health:
    get:
      tags: [Health]
      summary: Process and database health
      responses:
        "200":
          description: Database ping succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/Error"
  /zones:
    get:
      tags: [Zones]
      summary: List zones
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
          description: When true, only launch cities are returned.
      responses:
        "200":
          description: Zone list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneListResponse"
        "400":
          $ref: "#/components/responses/Error"
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send a one-time code
      description: Five requests per hour for the phone and twenty per hour for the IP. Development responses include dev_otp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPRequest"
            example:
              phone: "03001234567"
              role: customer
      responses:
        "200":
          description: Code stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTPResponse"
              example:
                data:
                  dev_otp: "123456"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Exchange a code for tokens
      description: The first customer verify creates the user. Rider, merchant, and admin accounts must already exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPVerify"
            example:
              phone: "03001234567"
              role: customer
              otp: "123456"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/google:
    post:
      tags: [Auth]
      summary: Sign in a customer with Firebase
      description: Customer role only. Verifies a Firebase ID token from Google sign-in and returns GharTak access and refresh tokens. The Firebase token is not sent again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignIn"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke one refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Refresh token revoked
        "400":
          $ref: "#/components/responses/Error"
  /geo/search:
    get:
      tags: [Geo]
      summary: Forward geocode (Pakistan)
      description: Proxies Mapbox Geocoding v6 with country=pk. Temporary results only. Persist map pin + user text.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 3, maxLength: 100}
        - name: near_lat
          in: query
          schema: {type: number}
        - name: near_lng
          in: query
          schema: {type: number}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 5, default: 5}
        - name: zone_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GeoPlace"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /geo/reverse:
    get:
      tags: [Geo]
      summary: Reverse geocode
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: {type: number}
        - name: lng
          in: query
          required: true
          schema: {type: number}
      responses:
        "200":
          description: Place
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/GeoPlace"
        "400":
          $ref: "#/components/responses/Error"
  /auth/phone/link:
    post:
      tags: [Auth]
      summary: Send an OTP to attach a phone
      description: Authenticated customer. Same OTP TTL, hash, and rate limits as phone login. Writes onto the current user. It does not merge a separate phone account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneLink"
      responses:
        "200":
          description: Code stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTPResponse"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/phone/link/verify:
    post:
      tags: [Auth]
      summary: Verify the phone attached to the current customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: {type: string, minLength: 6, maxLength: 6}
      responses:
        "204":
          description: Phone saved and verified
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /users/me:
    get:
      tags: [Auth]
      summary: Current customer profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
    patch:
      tags: [Auth]
      summary: Update the customer name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Auth]
      summary: Soft-delete the customer account
      description: Requires a zero wallet balance. Scrubs name, email, phone, and Firebase uid. Order history stays.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account deleted
        "409":
          $ref: "#/components/responses/Error"
  /uploads/presign:
    post:
      tags: [Auth]
      summary: Presign an object upload
      description: Authenticated caller. PUT the file to upload_url with Content-Type image/jpeg. Send object_key back on the owning request. CNIC and selfie are limited to 2 MB. Vehicle documents are 5 MB. Catalog and proof photos are 8 MB. The URL expires in 15 minutes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignRequest"
      responses:
        "200":
          description: Upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignResponse"
        "400":
          $ref: "#/components/responses/Error"
  /merchants/register:
    post:
      tags: [Merchants]
      summary: Register a merchant
      description: Verification stays pending. Commission is set from the category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantRegister"
            example:
              phone: "03007654321"
              owner_name: Ali Khan
              name: Attock Biryani
              category: restaurant
              zone_id: "11111111-1111-4111-8111-111111111101"
              lat: 33.773
              lng: 72.360
              address_text: Main bazaar, Attock City
      responses:
        "201":
          description: Merchant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /merchants:
    get:
      tags: [Merchants]
      summary: Approved merchants in a zone
      parameters:
        - $ref: "#/components/parameters/ZoneID"
      responses:
        "200":
          description: Merchant list, at most 20
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantListResponse"
        "400":
          $ref: "#/components/responses/Error"
  /merchants/{id}/catalog:
    get:
      tags: [Merchants]
      summary: Available catalog items
      parameters:
        - $ref: "#/components/parameters/MerchantID"
      responses:
        "200":
          description: Available items, at most 50
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogListResponse"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Merchants]
      summary: Add a catalog item
      security:
        - bearerAuth: []
      description: The bearer account id must equal the merchant id in the path.
      parameters:
        - $ref: "#/components/parameters/MerchantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogWrite"
            example:
              name: Chicken Biryani
              description: Half portion
              price: "450.00"
              is_available: true
              photo_key: catalog/biryani.jpg
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /merchants/{id}/catalog/{item_id}:
    patch:
      tags: [Merchants]
      summary: Replace a catalog item
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MerchantID"
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogWrite"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Merchants]
      summary: Delete a catalog item
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MerchantID"
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: Item deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /addresses:
    get:
      tags: [Addresses]
      summary: List the caller's addresses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: At most 20 addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Addresses]
      summary: Save an address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressWrite"
            example:
              label: Home
              lat: 33.77
              lng: 72.36
              address_text: House 1, Attock City
      responses:
        "201":
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /addresses/{id}:
    patch:
      tags: [Addresses]
      summary: Update one of the caller's addresses
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AddressID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressWrite"
      responses:
        "200":
          description: Address updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Addresses]
      summary: Delete one of the caller's addresses
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AddressID"
      responses:
        "200":
          description: Address deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /orders/quote:
    post:
      tags: [Orders]
      summary: Price an order without saving it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
            examples:
              errand:
                summary: Errand
                value:
                  type: errand
                  zone_id: "11111111-1111-4111-8111-111111111101"
                  pickup_lat: 33.773
                  pickup_lng: 72.360
                  pickup_address: Demo kitchen, Attock City
                  drop_lat: 33.780
                  drop_lng: 72.370
                  drop_address: House 1, Attock City
                  description: Pick up a parcel
                  effort_tier: medium
                  payment_method: cod
              food:
                summary: Food
                value:
                  type: food
                  zone_id: "11111111-1111-4111-8111-111111111101"
                  merchant_id: "22222222-2222-4222-8222-222222222201"
                  drop_lat: 33.780
                  drop_lng: 72.370
                  drop_address: House 1, Attock City
                  items:
                    - catalog_item_id: "00000000-0000-4000-8000-000000000001"
                      quantity: 2
                  payment_method: cod
      responses:
        "200":
          description: Price quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /orders:
    post:
      tags: [Orders]
      summary: Place an order
      description: The same client_request_id returns the original order. Payment is stored as held. A customer with phone_verified false gets 409 phone_required and no order is created.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrder"
            examples:
              errand:
                summary: Errand
                value:
                  type: errand
                  zone_id: "11111111-1111-4111-8111-111111111101"
                  pickup_lat: 33.773
                  pickup_lng: 72.360
                  pickup_address: Demo kitchen, Attock City
                  drop_lat: 33.780
                  drop_lng: 72.370
                  drop_address: House 1, Attock City
                  description: Pick up a parcel
                  effort_tier: medium
                  payment_method: cod
                  client_request_id: req-errand-0001
              food:
                summary: Food
                value:
                  type: food
                  zone_id: "11111111-1111-4111-8111-111111111101"
                  merchant_id: "22222222-2222-4222-8222-222222222201"
                  drop_lat: 33.780
                  drop_lng: 72.370
                  drop_address: House 1, Attock City
                  items:
                    - catalog_item_id: "00000000-0000-4000-8000-000000000001"
                      quantity: 1
                  payment_method: cod
                  client_request_id: req-food-0001
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "200":
          description: Existing order for this client_request_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get one of the caller's orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /riders/register:
    post:
      tags: [Riders]
      summary: Apply to ride for GharTak
      description: Creates a pending rider. The account stays offline until an admin approves it. Document fields are object storage keys, not file uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiderRegister"
            example:
              phone: "03001110001"
              name: Ali Raza
              cnic: "12345-1234567-1"
              cnic_object_key: kyc/cnic.jpg
              selfie_object_key: kyc/selfie.jpg
              license_object_key: kyc/license.jpg
              vehicle_reg: ATK-1234
              zone_id: "11111111-1111-4111-8111-111111111101"
      responses:
        "201":
          description: Rider application stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /riders/me:
    get:
      tags: [Riders]
      summary: Signed-in rider profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rider profile. Phone and CNIC numbers are omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /riders/availability:
    post:
      tags: [Riders]
      summary: Go online or offline
      description: Going online succeeds only when the rider is approved and assigned to a zone.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Availability"
            example:
              is_online: true
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderResponse"
        "403":
          $ref: "#/components/responses/Error"
  /admin/riders:
    get:
      tags: [Admin]
      summary: Rider verification queue
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, suspended]
            default: pending
      responses:
        "200":
          description: At most 20 riders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/riders/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve a pending rider
      description: Sets verification to approved and assigns the launch-city zone in one update. Development admin phone is 03000000002.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RiderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zone_id]
              properties:
                zone_id:
                  type: string
                  format: uuid
            example:
              zone_id: "11111111-1111-4111-8111-111111111101"
      responses:
        "200":
          description: Rider approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/riders/{id}/reject:
    post:
      tags: [Admin]
      summary: Reject a pending rider
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RiderID"
      responses:
        "200":
          description: Rider rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderResponse"
        "409":
          $ref: "#/components/responses/Error"
  /admin/riders/{id}/suspend:
    post:
      tags: [Admin]
      summary: Suspend an approved rider
      description: Turns the rider offline. A suspended rider cannot sign in.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RiderID"
      responses:
        "200":
          description: Rider suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderResponse"
        "409":
          $ref: "#/components/responses/Error"
  /admin/merchants/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve a pending merchant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Merchant approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantResponse"
        "404":
          $ref: "#/components/responses/Error"
  /admin/merchants/{id}/reject:
    post:
      tags: [Admin]
      summary: Reject a pending merchant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Merchant rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantResponse"
        "404":
          $ref: "#/components/responses/Error"
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order before delivery
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 200}
      responses:
        "200":
          description: Order cancelled. Wallet and gateway holds are refunded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
  /orders/{id}/dispatch:
    post:
      tags: [Dispatch]
      summary: Offer the order to the nearest online rider
      description: Food and mart must be ready_for_pickup. Courier and errand can be placed. A repeat offer stays on rider_offered.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Offer attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
  /orders/{id}/ratings:
    post:
      tags: [Support]
      summary: Rate a party after delivery
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ratee_role, ratee_id, score]
              properties:
                ratee_role: {type: string, enum: [customer, rider, merchant]}
                ratee_id: {type: string, format: uuid}
                score: {type: integer, minimum: 1, maximum: 5}
                comment: {type: string, maxLength: 1000}
      responses:
        "201":
          description: Rating stored
  /orders/{id}/messages:
    get:
      tags: [Chat]
      summary: Order chat history
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Latest 50 messages
    post:
      tags: [Chat]
      summary: Send an order chat message
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 1000}
      responses:
        "201":
          description: Message stored
  /merchants/orders:
    get:
      tags: [Merchants]
      summary: Merchant orders for one status
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: {type: string, default: placed}
      responses:
        "200":
          description: Up to 20 orders
  /merchants/orders/{id}/{action}:
    post:
      tags: [Merchants]
      summary: Accept, prepare, or mark ready
      description: action is accept, preparing, or ready. ready offers the order to a rider.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [accept, preparing, ready]}
      responses:
        "200":
          description: Status updated
  /riders/position:
    post:
      tags: [Riders]
      summary: Publish the rider position used for dispatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: {type: number}
                lng: {type: number}
      responses:
        "200":
          description: Position stored in Redis for about 45 seconds
  /riders/offers:
    get:
      tags: [Dispatch]
      summary: Open offers for the signed-in rider
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Up to 20 offers
  /riders/tasks:
    get:
      tags: [Riders]
      summary: Accepted, picked up, and on-the-way tasks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Up to 20 tasks
  /riders/tasks/{id}/accept:
    post:
      tags: [Dispatch]
      summary: Accept an offer
      description: Wins only while the order is rider_offered and has no rider.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Offer accepted
        "409":
          $ref: "#/components/responses/Error"
  /riders/tasks/{id}/reject:
    post:
      tags: [Dispatch]
      summary: Reject an offer
      description: Updates the offer only. The order stays rider_offered and the next rider can be offered.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Offer rejected
  /riders/tasks/{id}/pickup:
    post:
      tags: [Riders]
      summary: Mark the order picked up
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Status is picked_up
  /riders/tasks/{id}/enroute:
    post:
      tags: [Riders]
      summary: Mark the order on the way
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Status is on_the_way
  /riders/tasks/{id}/deliver:
    post:
      tags: [Riders]
      summary: Deliver the order
      description: Food and mart require delivery_otp from the customer order. Courier and errand require proof_photo_key. The ledger journal runs in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery_otp: {type: string}
                proof_photo_key: {type: string}
      responses:
        "200":
          description: Order delivered
  /payments/webhooks/{provider}:
    post:
      tags: [Payments]
      summary: Idempotent gateway status update
      description: Returns success when gateway_ref is already in the requested status. provider is jazzcash or easypaisa. This build records a stub gateway_ref of stub-{order_id}.
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway_ref, status]
              properties:
                gateway_ref: {type: string}
                status: {type: string, enum: [held, released, refunded, failed]}
      responses:
        "200":
          description: Status applied or already applied
  /admin/wallet/credits:
    post:
      tags: [Payments]
      summary: Credit a customer wallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, amount, request_id]
              properties:
                account_id: {type: string, format: uuid}
                amount: {type: string, example: "100.00"}
                request_id: {type: string}
      responses:
        "200":
          description: Wallet credited
  /admin/riders/{id}/settle:
    post:
      tags: [Payments]
      summary: Settle rider cash owed
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RiderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, request_id]
              properties:
                amount: {type: string, example: "50.00"}
                request_id: {type: string}
      responses:
        "200":
          description: Cash owed reduced
  /tickets:
    get:
      tags: [Support]
      summary: List the caller's tickets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Up to 20 tickets
    post:
      tags: [Support]
      summary: Open a support ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, body]
              properties:
                order_id: {type: string, format: uuid}
                body: {type: string}
      responses:
        "201":
          description: Ticket opened
  /tickets/{id}:
    get:
      tags: [Support]
      summary: Get one ticket
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Ticket
  /tickets/{id}/messages:
    get:
      tags: [Support]
      summary: Ticket messages
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Up to 50 messages
    post:
      tags: [Support]
      summary: Reply on a ticket
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string}
      responses:
        "201":
          description: Message stored
  /notifications/devices:
    post:
      tags: [Notifications]
      summary: Register an FCM device token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        "200":
          description: Token saved
  /ws/location/{order_id}:
    get:
      tags: [Dispatch]
      summary: Live rider location
      description: WebSocket. Send Authorization Bearer. The assigned rider publishes {"lat","lng"}. Redis channel order:{id}:location fans the point out. Postgres stays the source for order status.
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "101":
          description: Switching protocols
  /ws/chat/{order_id}:
    get:
      tags: [Chat]
      summary: Live order chat
      description: WebSocket on the same net/http server as the API. Send Authorization Bearer, then text frames {"body":"..."}. Messages are stored in Postgres. Redis only fans them out.
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "101":
          description: Switching protocols
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the access_token from POST /auth/otp/verify.
  parameters:
    ZoneID:
      name: zone_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
      example: "11111111-1111-4111-8111-111111111101"
    MerchantID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: "22222222-2222-4222-8222-222222222201"
    ItemID:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AddressID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RiderID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    Money:
      type: string
      description: PKR decimal string, such as "60.00".
      example: "60.00"
    Role:
      type: string
      enum: [customer, rider, merchant, admin]
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: ok
    Zone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        city_name:
          type: string
        slug:
          type: string
        base_delivery_fee:
          $ref: "#/components/schemas/Money"
        per_km_rate:
          $ref: "#/components/schemas/Money"
        surge_multiplier:
          type: string
        service_radius_km:
          type: string
        center_lat:
          type: number
        center_lng:
          type: number
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ZoneListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
    GeoPlace:
      type: object
      properties:
        label: {type: string}
        lat: {type: number}
        lng: {type: number}
        place: {type: string}
    OTPRequest:
      type: object
      required: [phone, role]
      properties:
        phone:
          type: string
          example: "03001234567"
        role:
          $ref: "#/components/schemas/Role"
    OTPResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            dev_otp:
              type: string
              description: Present only when APP_ENV is development.
    OTPVerify:
      type: object
      required: [phone, role, otp]
      properties:
        phone:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        otp:
          type: string
          minLength: 6
          maxLength: 6
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    Session:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          example: 3600
        account_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        status:
          type: string
    SessionResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Session"
    GoogleSignIn:
      type: object
      required: [firebase_id_token]
      properties:
        firebase_id_token:
          type: string
    PhoneLink:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: "03001234567"
    Profile:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string, nullable: true}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        phone_verified: {type: boolean}
        wallet_balance:
          $ref: "#/components/schemas/Money"
    ProfileResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Profile"
    PresignRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [cnic, selfie, vehicle_doc, catalog_photo, proof_of_delivery]
    PresignResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            upload_url: {type: string}
            object_key: {type: string}
            expires_in: {type: integer, example: 900}
            content_type: {type: string, example: image/jpeg}
            max_bytes: {type: integer}
    MerchantRegister:
      type: object
      required: [phone, owner_name, name, category, zone_id, lat, lng, address_text]
      properties:
        phone:
          type: string
        owner_name:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [restaurant, mart, pharmacy]
        zone_id:
          type: string
          format: uuid
        lat:
          type: number
        lng:
          type: number
        address_text:
          type: string
    Merchant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        zone_id:
          type: string
          format: uuid
        lat:
          type: number
        lng:
          type: number
        address_text:
          type: string
        photo_key:
          type: string
          nullable: true
        commission_rate:
          type: string
        verification_status:
          type: string
    MerchantResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Merchant"
    MerchantListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Merchant"
    CatalogWrite:
      type: object
      required: [name, price, is_available]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        is_available:
          type: boolean
        photo_key:
          type: string
    CatalogItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          $ref: "#/components/schemas/Money"
        is_available:
          type: boolean
        photo_key:
          type: string
          nullable: true
    CatalogItemResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CatalogItem"
    CatalogListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"
    AddressWrite:
      type: object
      required: [label, lat, lng, address_text]
      properties:
        label:
          type: string
        lat:
          type: number
        lng:
          type: number
        address_text:
          type: string
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        label:
          type: string
        lat:
          type: number
        lng:
          type: number
        address_text:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AddressResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Address"
    AddressListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Address"
    DeletedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            deleted:
              type: boolean
    OrderItemInput:
      type: object
      required: [catalog_item_id, quantity]
      properties:
        catalog_item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 20
    QuoteRequest:
      type: object
      required: [type, zone_id, drop_lat, drop_lng, drop_address, payment_method]
      properties:
        type:
          type: string
          enum: [food, mart, courier, errand]
        zone_id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
          description: Required for food and mart.
        pickup_lat:
          type: number
        pickup_lng:
          type: number
        pickup_address:
          type: string
        drop_lat:
          type: number
        drop_lng:
          type: number
        drop_address:
          type: string
        description:
          type: string
          description: Required for courier and errand.
        effort_tier:
          type: string
          enum: [low, medium, high]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
        payment_method:
          type: string
          enum: [jazzcash, easypaisa, cod, wallet]
    PlaceOrder:
      allOf:
        - $ref: "#/components/schemas/QuoteRequest"
        - type: object
          required: [client_request_id]
          properties:
            client_request_id:
              type: string
              minLength: 8
              maxLength: 64
    Quote:
      type: object
      properties:
        distance_km:
          type: string
        duration_min:
          type: integer
        item_total:
          $ref: "#/components/schemas/Money"
        delivery_fee:
          $ref: "#/components/schemas/Money"
        commission_amount:
          $ref: "#/components/schemas/Money"
        rider_earning:
          $ref: "#/components/schemas/Money"
        surge_multiplier:
          type: string
        total:
          $ref: "#/components/schemas/Money"
        approximate:
          type: boolean
          description: True when distance came from haversine fallback instead of Mapbox Directions.
        route:
          type: object
          nullable: true
          description: Optional Mapbox LineString geometry for the priced path.
          additionalProperties: true
    QuoteResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Quote"
    OrderItem:
      type: object
      properties:
        catalog_item_id:
          type: string
          format: uuid
          nullable: true
        item_name:
          type: string
        quantity:
          type: integer
        price_at_order:
          $ref: "#/components/schemas/Money"
    Order:
      allOf:
        - $ref: "#/components/schemas/Quote"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
            customer_id:
              type: string
              format: uuid
            merchant_id:
              type: string
              format: uuid
              nullable: true
            zone_id:
              type: string
              format: uuid
            status:
              type: string
            pickup_lat:
              type: number
            pickup_lng:
              type: number
            drop_lat:
              type: number
            drop_lng:
              type: number
            pickup_address:
              type: string
            drop_address:
              type: string
            description:
              type: string
              nullable: true
            effort_tier:
              type: string
              nullable: true
            payment_method:
              type: string
            client_request_id:
              type: string
            created_at:
              type: string
              format: date-time
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderItem"
    OrderResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Order"
    RiderRegister:
      type: object
      required: [phone, name, cnic, cnic_object_key, selfie_object_key, license_object_key, vehicle_reg, zone_id]
      properties:
        phone:
          type: string
        name:
          type: string
        cnic:
          type: string
          description: 12345-1234567-1. Stored encrypted. Never returned.
        cnic_object_key:
          type: string
        selfie_object_key:
          type: string
        license_object_key:
          type: string
        vehicle_reg:
          type: string
        zone_id:
          type: string
          format: uuid
    Availability:
      type: object
      required: [is_online]
      properties:
        is_online:
          type: boolean
    Rider:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        verification_status:
          type: string
          enum: [pending, approved, rejected, suspended]
        zone_id:
          type: string
          format: uuid
          nullable: true
        vehicle_reg:
          type: string
        is_online:
          type: boolean
        rating:
          type: string
        rating_count:
          type: integer
        cnic_object_key:
          type: string
          nullable: true
        selfie_object_key:
          type: string
          nullable: true
        license_object_key:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    RiderResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Rider"
    RiderListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Rider"
